<template id="aboutTpl">
  <p>The owner, 2026-11-15: <q>quick note on rain, one of the things were missing are puddle splashes on the ground, can you mock thatn up for me</q>, then <q>particle splashing for rain, the more gpu native rain we can have the better</q>.</p>
  <h3>Today and With splashes</h3>
  <ul>
    <li><b>Today</b> is what the game draws in rain: the ground darkened and deepened, puddles on flat bare ground with the impact rings in them (half-strength rings on grass), and the near shower of streaks. Nothing leaves the ground.</li>
    <li><b>With splashes</b> adds the splash where a drop lands: on a puddle, a crown of six droplets and a late central jet; on wet dirt and boards, five lower droplets; on grass, a softer spray of three or four. About a third of a second each, many at once around you, more on puddles than on grass.</li>
  </ul>
  <h3>The scene</h3>
  <p>A patch of the game's hex ground: 2.833 m cells, 1 m layers, two terraces, a path and a dirt yard where puddles stand, and a board roof on posts. Under the roof the ground stays dry and no splash lands; the roof's top takes them instead. The terrace sides are vertical faces and take none. At night four lamps light the ground, the puddles and the droplets near them; the moon is dim.</p>
  <h3>Controls</h3>
  <ul>
    <li>Drag to turn, wheel or pinch to come closer. The views are presets; nothing turns on its own.</li>
    <li><b>Slow motion</b> runs everything at a tenth of the speed, so a crown's shape can be judged. <b>Pause</b> stops time.</li>
    <li><b>Splash density</b> scales how often each slot fires; <b>Splash size</b> scales the droplets and how high they go.</li>
  </ul>
  <h3>What is the game's here</h3>
  <ul>
    <li>The ground's textures: the shipped terrain atlas (<code>assets/tilesets/atlas.png</code> at <code>c84a873</code>, byte for byte in <code>rain-splashes/atlas.png</code>), read as <code>pixel_tile</code> reads it, nearest-sampled: the fields sheet's pasture grass, grass-over-dirt side, crumbly dirt, packed path and oak boards.</li>
    <li>The wet block of <code>planet_surface.wgsl</code>: the darkening (<code>rain_wet_darken</code> 0.72, times 0.85, and 0.7 more in a puddle), the saturation, the puddle mask (its two octaves of <code>puddle_noise</code>, <code>rain_puddle_scale_m</code> 0.4, <code>rain_puddle_share</code> 0.35 and the quantile edge), the ring kernel (<code>rain_rings</code>, scale 5, strength 2, grass at 0.5) within the 20 m reach, and the puddle's mirror and lamp highlight at the wet and puddle roughness.</li>
    <li>The near shower's constants: up to 1,700 streaks on an 18 m disk, 70 m/s down a 46 m column, 1.5 m long, its colour and its near and far alpha.</li>
    <li>Not the game's: the light (a stand-in overcast sky and moon, no shadows, no tone mapping), the fog, the lamps, the roof. The lens drops and the far rain volume are not drawn.</li>
  </ul>
</template>

<template id="methodTpl">
  <h3>GPU particles, no CPU per droplet</h3>
  <p>The owner: <q>the more gpu native rain we can have the better</q>. Every droplet on this page is placed by its vertex shader from its lane number and the time; the page sets a few uniforms a frame and uploads nothing else. That is the method proposed for the game (<code>openspec/changes/weather-rain/design.md</code>, "Splashes where rain lands").</p>
  <ul>
    <li><b>Lanes on the columns.</b> Each hex column whose top face sees the sky gets 48 slots of 8 droplets. The column list (centre, top height, material, sky light) is built once here; in the game it is rebuilt only when the camera crosses a cell or a column near it is edited.</li>
    <li><b>Slots fire on a hash.</b> A slot's cycle is <code>time / period + hash(slot)</code>; each cycle it fires if a hash is below the rain's rate (puddle 1, bare wet ground 0.8, grass 0.5), at a new hashed point on the hex top.</li>
    <li><b>Droplets fly a ballistic arc</b> from a hashed launch, and are gone when they fall back to the surface.</li>
    <li><b>Crown, spray or wet-ground</b> is chosen at the impact point by the same puddle mask the ground draws, so crowns land in the puddles you see.</li>
    <li><b>The streaks too:</b> the page draws today's near shower the same way, from the game's own seed layout. In the game that would be a separate, later change.</li>
  </ul>
  <h3>Budget (an estimate)</h3>
  <div class="tw"><table>
    <tr><th>Quantity</th><th>Value</th></tr>
    <tr><td>Columns within 22 m</td><td>about 220</td></tr>
    <tr><td>Droplet lanes</td><td>10,560 slots, 84,480 droplets, a fixed ceiling</td></tr>
    <tr><td>Alive in a storm</td><td>about 28,000 droplets</td></tr>
    <tr><td>Upload</td><td>3.5 KB on a cell crossing; nothing per frame</td></tr>
    <tr><td>Budget</td><td>0.25 ms GPU at p50 in <code>storm</code> and <code>rain-stroll</code>, old against new in one sitting</td></tr>
  </table></div>
  <p>The page's own patch is larger than the reach (about 400 columns, 152,000 droplet lanes as points), and culls past 20 m in the shader as the game would.</p>
</template>
