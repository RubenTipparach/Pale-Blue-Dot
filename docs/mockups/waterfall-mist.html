<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="mbox"><div class="mhead"><h2 id="modalTitle"></h2><button class="mclose" id="modalClose" aria-label="Close">&#x2715;</button></div><div class="mbody" id="modalBody"></div></div></div>
<template id="aboutTpl">
  <p>How the spray and mist at a fall's foot look once they draw in front of the water, and the bubbles under it, in a mockup before any game code (CLAUDE.md, "Waterfalls are designed in a mockup first").</p>
  <h3>What the owner asked</h3>
  <ul>
    <li><q>water fall splash fx still not drawn in front of water</q>: the order fix (branch <code>claude/fall-splash-order</code>).</li>
    <li><q>design better mist instead of just a gradient circle puff, use blender/krita or whatever, look at crab breeze smoke puffs as a model</q>.</li>
    <li><q>in the water there should be bubbles particles, this should give it that teal color</q>.</li>
    <li><q>whats rules behind waterfall? I feel like anything that exposes this even a tiny bit of the water falling animation should have some mist</q>: the mist rule, below.</li>
    <li><q>show me a comparison of different water fall heights</q>: five falls side by side.</li>
    <li><q>can you make the side scrolling texture increase with the height of the fall?</q>: the speed-up, below.</li>
  </ul>
  <h3>The tabs</h3>
  <ul>
    <li><b>Game today</b>: the splash is drawn with the scene before the water. The water reads it as what lies behind it and paints over it, so the mist never stands on the pool; it only leaks through as a teal glow.</li>
    <li><b>Fixed order</b>: the same drops and puffs, drawn after the water and tested against its depth: in front of the water, hidden under it. The pool shows its own deep colour.</li>
    <li><b>New mist + bubbles</b>: the fixed order, with lumpy lit puffs in place of the gradient dot, bubbles rising in the pool under the fall (which make the churned water there a lighter, aerated teal), the proposed mist rule and the fall's scroll speeding up down its height.</li>
  </ul>
  <h3>The scene</h3>
  <p>Five falls side by side off one plateau, the same on every tab, so a height can be compared before and after:</p>
  <ul>
    <li><b>Riffle</b>: a river stepping down one layer. The source spills into a falling cell over a channel one layer lower, whose shallow water (0.7 m) runs on. It drops about 1 m.</li>
    <li><b>1, 2, 4 and 9 layers</b>: a fall of that many layers into a pool 3.35 m deep, dug into a shore one layer under the lip less than the fall. The 9 is the scene the owner tuned the mist on (a pit two rings wide); the others are one ring wide.</li>
  </ul>
  <p><b>Fall</b> picks one to come close to; <b>All</b> frames them together. <b>Under</b> is always one pool (the 9's for All). Cells are the game's: 2.833 m across, 1 m layers. Drag to turn, middle-drag to pan, wheel or pinch to come closer. The water and the splash move; nothing else does. At night two lamps by each fall light the ground, the water, the new mist and the bubbles.</p>
  <h3>Where the game shows the fall animation</h3>
  <p>The scrolling froth is drawn on a water face of kind 2 (<code>KIND_FALLING</code>). The mesher (<code>cell_pieces</code>, <code>water_flow.rs</code>) gives a side that kind when its cell is falling, or when it is flowing with water on top of it:</p>
  <ul>
    <li><b>a falling cell's sides over air</b>: the fall's sheet, every layer from the lip down;</li>
    <li><b>a foot cell's sides over air</b>: the flowing cell a fall lands on, while its water has not yet spread to the cell beside it (for a tick or two);</li>
    <li>a falling cell's side over lower water is meant to reach down to it, but over water it is drawn from the cell's top to its top, so it has no height and never shows.</li>
  </ul>
  <p>A water cell is falling when the cell under it is air or flowing water. So a river stepping down a layer is a fall like any other: one falling cell, then its foot (<i>h</i> = 1). Two flowing tops in the same layer at different levels are one sloped top, with no face between them and no fall animation. Every fall that has landed has a foot, so no place shows the animation with no splash at all; but a fall of 1 or 2 layers gets one puff, faint (0.16 and 0.20), with 9 or 15 spray drops, and the faces high up a tall fall get nothing.</p>
  <p>Over still (source) water the count is one short: water over a source is not falling, so a fall into a source pool is a layer shorter by <i>h</i>, and a single-layer spill onto one has no falling cell, a still face and no splash.</p>
  <h3>The mist rule, today and proposed</h3>
  <p>The game's measure is <i>h</i>, the falling layers over the foot. The proposal measures <i>D</i>, metres from the lip's water to the water it lands in, so a part-layer step counts, and gives everything a floor. <b>Mist rule</b> switches the New tab between the two.</p>
  <div class="tw"><table>
    <tr><th></th><th>Game today (<i>h</i> layers)</th><th>Proposed (<i>D</i> metres)</th></tr>
    <tr><td>Mist puffs</td><td>clamp((<i>h</i> &minus; 1) &times; 1.5, 1, 24)</td><td>clamp(round(7 + 0.75 <i>D</i>), 8, 24)</td></tr>
    <tr><td>Puff alpha</td><td>0.12 + 0.33 min(<i>h</i>/8, 1)</td><td>0.45, every fall (today's from 8 layers)</td></tr>
    <tr><td>Puff size</td><td>min(0.5 + 0.18 <i>h</i>, 5)</td><td>max(0.35, min(0.25 + 0.19 <i>D</i>, 5))</td></tr>
    <tr><td>Puff rise</td><td>0.25 + 0.04 <i>h</i> m/s</td><td>0.15 + 0.05 <i>D</i> m/s (a short fall's mist stays at its foot)</td></tr>
    <tr><td>Where</td><td>a ring all round the foot</td><td>the open side, within 110&deg; of the way the water goes over</td></tr>
    <tr><td>Spray drops</td><td>min(3 + 6 <i>h</i>, 160)</td><td>max(12, min(3 + 6 <i>D</i>, 160))</td></tr>
    <tr><td>Fall droplets</td><td>none</td><td>max(6, min(160, 9 <i>D</i>))</td></tr>
  </table></div>
  <div class="tw"><table>
    <tr><th>Fall</th><th><i>h</i></th><th><i>D</i></th><th>Puffs, alpha (today)</th><th>Puffs, alpha (proposed)</th></tr>
    <tr><td>Riffle</td><td>1</td><td>1.05 m</td><td>1, 0.16</td><td>8, 0.45</td></tr>
    <tr><td>1 layer</td><td>1</td><td>1.4 m</td><td>1, 0.16</td><td>8, 0.45</td></tr>
    <tr><td>2 layers</td><td>2</td><td>2.4 m</td><td>1, 0.20</td><td>9, 0.45</td></tr>
    <tr><td>4 layers</td><td>4</td><td>4.4 m</td><td>4, 0.29</td><td>10, 0.45</td></tr>
    <tr><td>9 layers</td><td>9</td><td>9.4 m</td><td>12, 0.45</td><td>14, 0.45</td></tr>
  </table></div>
  <p>In the game every run of falling faces would carry its own foot record, the bottom of its lowest face, so a foot cell's face over air mists too.</p>
  <h3>The scroll, faster down a taller fall</h3>
  <ul>
    <li>Today a falling face scrolls at one speed top to bottom: the waves at 1 m/s (<code>flow_uv_speed_falling</code>), the froth streaks at 2.7 m/s (the same scroll plus a 0.6 drift on the stretched noise).</li>
    <li>On the New tab the water speeds up as it falls: <i>s</i> metres under the lip it moves at <i>v</i> = min(&radic;(<i>v</i><sub>0</sub>&sup2; + 2<i>g s</i>), 8 m/s), with <i>g</i> = 3 m/s&sup2; at <b>Fall speed-up</b> 1.00 (0 is the game's constant scroll). The froth starts at 2.7 m/s at the lip and is near 4 m/s at the foot of a 1-layer fall and 8 m/s at the foot of the 9.</li>
    <li>The pattern stays one piece: it is read at <i>c</i>(<i>s</i>) = <i>v</i><sub>0</sub>&tau;(<i>s</i>), &tau; the time the water takes to fall <i>s</i> metres, and scrolled at <i>v</i><sub>0</sub>. A feature then moves at <i>v</i>(<i>s</i>) and stretches as it speeds up, as a falling blob of water does. Scrolling each height by <i>t</i>&nbsp;<i>v</i>(<i>s</i>) instead would shear the pattern apart a little more every second.</li>
  </ul>
  <h3>What is the game's here</h3>
  <ul>
    <li><b>The water</b>: M31's port of the game's water fragment (<code>water.wgsl</code> at <code>dc0c5cb</code>): its colours, absorption, Fresnel, sky and froth. Added here: the pool's real depth under each cap, and the game's view from below (the murk by distance, Snell's window).</li>
    <li><b>The splash</b>: a line-for-line port of the game's <code>animate_splash</code> (<code>water_flow.rs</code>): the same drops, puffs, sizes, timings and alpha, and the same 32-texel dot sampled nearest.</li>
    <li><b>The draw order</b> of each tab is the game's: today's (splash with the scene, before the water) and the branch's (after the water, against its depth).</li>
    <li><b>Mockup-only</b>: the ground's sand, the sky, the lamps, the new puff sheet, the bubbles and the aerated colour.</li>
  </ul>
  <h3>The new puffs</h3>
  <ul>
    <li>Modelled after Crab Breeze's <code>smoke_puffs</code> and <code>smoke_lit</code> (a 4 x 4 sheet of lumpy puffs, with normals so the sun can light them).</li>
    <li>Built in Blender (<code>tools/fx/mist_puffs_blender.py</code>): each puff is a cluster of metaballs roughened into billows, rendered face-on.</li>
    <li>Cut to the game's pixel look by <code>tools/fx/mist_puffs_post.py</code>: 32-texel cells sampled nearest, a five-tone ramp lit from above, soft over the outer three texels, no outline.</li>
    <li>Rows are four puffs; columns are a puff's life: tight as it leaves the foot, swelling, then fraying. Each mist puff of the game's splash picks a row by its own hash and a column by its age.</li>
    <li><b>Mist opacity</b> scales the puffs' alpha. At 0.80 a puff covers the same total as the dot it replaces.</li>
    <li><b>Mist amount</b> scales how many puffs rise (1.00 is the game's count, up to 24 a fall; 0 none, 3 triple). <b>Mist size</b> scales each puff.</li>
    <li><b>Fall droplets</b> (new): water drops shaken off the falling sheet all the way down, already moving at the fall's speed, flung a little outward and falling into the pool; more of them low down. Each is a streak: the drop and a trail along the path it just took, longer the faster it falls (<b>Droplet streak</b> sets the length; 0 is a single drop). 1.00 is about 9 drops per metre fallen; 0 none. <b>Mist size</b> also scales them.</li>
    <li><b>Wall blend</b> (new): each puff fades out as it nears the wall or ground behind it, over this many metres, so a puff meeting a wall leaves no hard edge (a soft particle; 0 is off, the game today).</li>
    <li><b>Bubbles</b> scales how many bubbles rise (1.00 is the default count, 60 plus 14 per metre fallen; 0 none, 2 double).</li>
    <li><b>Teal churn</b> scales how strongly the water over the bubbles turns aerated teal (1.00 default, 0 none).</li>
    <li>The sheet's normals (<code>assets/textures/fx/mist_puffs/normal.png</code>) are made for lighting by the sun in the game. The page uses the shade baked into the sheet.</li>
  </ul>
  <h3>The bubbles</h3>
  <ul>
    <li>60 + 14 per metre fallen, born under the falling column and round it, down to 0.6 m + 0.22 m per metre fallen.</li>
    <li>They rise at 0.35 to 0.7 m/s, wobbling, and are gone at the surface. Each is an 8-texel sprite: a bright rim, a clear middle and a glint.</li>
    <li>They are drawn under the water, so from above the water's own transmission tints them. From under the pool the eye sees them through the murk.</li>
    <li>Over them the pool's colour moves toward a lighter teal and the eye sees less deep into it: the churn of air in the water.</li>
    <li>In the game they would run on the GPU in the water's own pass, as the splash now does.</li>
  </ul>
  <h3>Game shot</h3>
  <p>The toggle shows the game's own capture for the open view: today's build on <b>Game today</b>, the order fix on the other two. The captures are of a different fall (9 layers into a pool, in jungle), so they show the kind of look rather than the same place.</p>
</template>
<template id="tab-today"><p><b>Game today.</b> The splash is drawn with the scene, before the water. The water paints over it, so the mist and drops over the pool are lost and leak through as a teal glow.</p></template>
<template id="tab-fixed"><p><b>Fixed order.</b> The same splash, drawn after the water against its depth: in front of the water, hidden by it. The pool shows its own deep colour. The mist is the game's gradient dot.</p></template>
<template id="tab-new"><p><b>New mist + bubbles.</b> The fixed order, with lumpy lit mist puffs in place of the dot, bubbles rising in the pool under the fall, and the aerated teal over them. <b>Mist opacity</b> scales the puffs; 0.80 matches the dot's total cover.</p><p><b>Mist rule</b>: <b>Proposed</b> mists every fall by the metres it drops, with a floor, so the riffle and the 1 and 2-layer falls read as misty; <b>Game's</b> is today's count by whole falling layers. <b>Fall speed-up</b>: the falling faces scroll faster further down, so a taller fall's foot runs fastest (0 is the game's one speed). The About modal has the rules and numbers.</p></template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="waterfall-mist/mist.js?v=16"></script>
<script>
"use strict";
let MODAL_BACK = null;
function openModal(title, node) {
  const m = document.getElementById("modal"), body = document.getElementById("modalBody");
  document.getElementById("modalTitle").textContent = title; body.innerHTML = ""; body.appendChild(node);
  MODAL_BACK = document.activeElement; m.hidden = false; body.scrollTop = 0; document.getElementById("modalClose").focus();
}
function closeModal() { const m = document.getElementById("modal"); if (m.hidden) return; m.hidden = true; if (MODAL_BACK && MODAL_BACK.focus) MODAL_BACK.focus(); }
const TITLES = {today: "Game today", fixed: "Fixed order", new: "New mist + bubbles"};
let TAB = "new", VIEW = "above";
document.addEventListener("click", e => {
  const b = e.target.closest("[data-modal], #tabInfo"); if (!b) return;
  const ids = b.id === "tabInfo" ? ["tab-" + TAB] : b.dataset.modal.split(" ");
  const frag = document.createDocumentFragment();
  for (const id of ids) { const t = document.getElementById(id); if (t) frag.appendChild(t.content.cloneNode(true)); }
  openModal(b.id === "tabInfo" ? TITLES[TAB] : (b.dataset.title || ""), frag);
});
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.getElementById("modalClose").addEventListener("click", closeModal);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

const P = PBDMist(document.getElementById("view"), "waterfall-mist/mist_puffs.png?v=1", {labels: document.getElementById("flabels")});
function refresh() {
  document.getElementById("vtitle").textContent = TITLES[TAB];
  document.getElementById("newPanel").hidden = TAB !== "new";
  const which = TAB === "today" ? "today" : "fixed";
  document.getElementById("refImg").src = `waterfall-mist/game-${VIEW === "above" ? "down" : VIEW}-${which}.jpg`;
  document.getElementById("refLbl").textContent = which === "today" ? "The game today" : "The game, order fixed";
  document.getElementById("ref").hidden = !document.getElementById("showRef").checked;
}
function showTab(name) {
  if (!TITLES[name] || name === "today") name = "new";
  TAB = name; P.S.variant = name; P.apply();
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-pressed", String(b.dataset.tab === name));
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  refresh();
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
document.getElementById("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if (!b) return; VIEW = b.dataset.view; P.look(VIEW);
  for (const x of document.querySelectorAll("#views button")) x.setAttribute("aria-pressed", String(x === b)); refresh();
});
document.getElementById("tod").addEventListener("click", e => {
  const b = e.target.closest("button[data-tod]"); if (!b) return; P.S.night = b.dataset.tod === "night"; P.apply();
  for (const x of document.querySelectorAll("#tod button")) x.setAttribute("aria-pressed", String(x === b));
});
document.getElementById("focus").addEventListener("click", e => {
  const b = e.target.closest("button[data-focus]"); if (!b) return; P.look(VIEW, b.dataset.focus);
  for (const x of document.querySelectorAll("#focus button")) x.setAttribute("aria-pressed", String(x === b));
});
document.getElementById("rule").addEventListener("click", e => {
  const b = e.target.closest("button[data-rule]"); if (!b) return; P.S.rule = b.dataset.rule;
  for (const x of document.querySelectorAll("#rule button")) x.setAttribute("aria-pressed", String(x === b));
});
document.getElementById("pause").addEventListener("change", e => { P.S.running = !e.target.checked; });
document.getElementById("showRef").addEventListener("change", refresh);
const gain = document.getElementById("gain");
gain.addEventListener("input", () => { P.S.gain = +gain.value; document.getElementById("gainOut").textContent = (+gain.value).toFixed(2); P.apply(); });
for (const [id, key] of [["bub", "bubbles"], ["teal", "teal"], ["mist", "mist"], ["mistSize", "mistSize"], ["veil", "veil"], ["soft", "soft"], ["streak", "streak"], ["accel", "accel"]]) {
  const el = document.getElementById(id);
  el.addEventListener("input", () => { P.S[key] = +el.value; document.getElementById(id + "Out").textContent = (+el.value).toFixed(2); P.apply(); });
}
// The bubble swatch: the same 8 texels the shader draws.
(function () {
  const g = document.getElementById("bubbleSwatch").getContext("2d");
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const dx = (x + 0.5) / 4 - 1, dy = (y + 0.5) / 4 - 1, r = Math.hypot(dx, dy); if (r > 1) continue;
    const t = Math.min(1, Math.max(0, (r - 0.55) / 0.25)), s = t * t * (3 - 2 * t);
    let a = 0.28 + (0.9 - 0.28) * s, c = [219, 247, 255];
    if (x === 2 && y === 2) { c = [255, 255, 255]; a = 1; }
    g.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a})`; g.fillRect(x, y, 1, 1);
  }
})();
window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));
showTab(location.hash.slice(1) || "new");
P.start();
window.PAGE = {P, showTab, setView: v => document.querySelector(`#views button[data-view="${v}"]`).click(),
  setFocus: f => document.querySelector(`#focus button[data-focus="${f}"]`).click(), setNight: n => document.querySelector(`#tod button[data-tod="${n ? "night" : "day"}"]`).click()};
</script>
