[package]
name = "pbd-save"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# A world's journal on disk, its line format and its writer, with no Bevy:
# the game's saves and the dedicated server (`openspec/changes/multiplayer`
# design 27) write the same lines through it.
[dependencies]
pbd-core = { path = "../pbd-core" }
glam.workspace = true
ron = "0.12"
serde = { version = "1", features = ["derive"] }
