mission:
  axe:
    help: "Punch a tree for logs, then make a stone axe in the pack's Craft row (I)."
    objective:
      "0": Make a stone axe
    title: Craft an axe
  bait:
    help: "Dig dirt for bait worms; cast with them in your pack and they go on the hook."
    objective:
      "0": Dig up bait
      "1": Catch fish on bait
    title: Dig for bait
  boat:
    help: "Board a boat at a town's quay (F) and head out."
    objective:
      "0": Board a boat
      "1": Travel by boat
    title: Take a boat
  bow:
    help: Make the bow at the workbench.
    objective:
      "0": Make a bow
      "1": Make arrows
    title: Bow and arrows
  bread:
    help: At the campfire, bake flatbread from wheat you grew.
    objective:
      "0": Bake flatbread
    title: Bake bread
  bronze-tool:
    help: "At the workbench, make a bronze pickaxe from ingots; it digs faster than stone."
    objective:
      "0": Make a bronze pickaxe
      "1": Dig stone
    title: Bronze tools
  build:
    help: "Hold planks, stone or soil and place blocks with the right button: walls and a roof."
    objective:
      "0": Place blocks
    title: Build a shelter
  cactus:
    help: Hold the straw to a desert cactus.
    objective:
      "0": Sip a cactus
    title: Cactus juice
  collect:
    help: "A kept animal in a pen gives an egg, wool or milk once a day: F on it collects."
    objective:
      "0": Collect eggs
    title: Collect from the herd
  cook-fish:
    help: Open the campfire with F and grill the fish you caught.
    objective:
      "0": Grill fish
    title: Cook fish
  cook-meal:
    help: Fry an egg or grill fish at the campfire.
    objective:
      "0": Cook a dish
      "1": Eat it
    title: A hot meal
  cook-meat:
    help: Put raw meat on the campfire.
    objective:
      "0": Cook roast meat
    title: Cook meat
  cool-down:
    help: Stand in the shade or get in the water.
    objective:
      "0": Cool down
    title: Out of the heat
  crafting-table:
    help: Make a workbench from six planks in the Craft row, then place it on the ground.
    objective:
      "0": Make a workbench
      "1": Set it down
    title: Build a crafting bench
  dig-deep:
    help: "Hold the stone pickaxe and dig into a hillside; stone comes out a cell at a time."
    objective:
      "0": Dig stone
    title: Dig into the hill
  dress:
    help: Use a blade on the kill before it is gone.
    objective:
      "0": Take a hide
    title: Dress a kill
  dress-weather:
    help: Put it on in the pack.
    objective:
      "0": Wear a hat or cloak
    title: Dress for the weather
  drink:
    help: Press F at a river or lake. Sea water is salt.
    objective:
      "0": Drink fresh water
    title: Drink water
  eat:
    help: "Put a dish on the hotbar and use it; its effect shows by the hotbar."
    objective:
      "0": Eat a cooked dish
    title: Eat well
  farm-meal:
    help: At the campfire, cook a dish from your field.
    objective:
      "0": Cook a farm dish
    title: A farm meal
  feast:
    help: "Eat three dishes: one from the sea, one from the field and one from the coop."
    objective:
      "0": Eat from the sea
      "1": Eat from the field
      "2": Eat from the coop
    title: A feast
  fence:
    help: At the workbench, make fences and a gate from planks and rope.
    objective:
      "0": Make fences
      "1": Make a gate
    title: Make fences
  fend-off:
    help: Foxes come at night. Strike back.
    objective:
      "0": Drive one off
    title: Drive off a predator
  find-seeds:
    help: "Seeds turn up when you dig grass, and wild plants give them when picked (F)."
    objective:
      "0": Find seeds
    title: Find seeds
  fire:
    help: Make a campfire in the Craft row from five loose stone and two logs, and set it down near water.
    objective:
      "0": Make a campfire
      "1": Set it down
    title: Make a fire
  first-night:
    help: "Keep warm, fed and watered until morning."
    objective:
      "0": See the dawn
    title: The first night
  flock:
    help: "Woolbacks and plodders graze in open country; tame one as you did the hen."
    objective:
      "0": Tame a woolback or plodder
      "1": Collect wool or milk
    title: A mixed herd
  forage:
    help: "Pick fruit from a tree, or take an egg from a nest."
    objective:
      "0": Eat raw food
    title: Something to eat
  forge:
    help: Make a forge at the workbench and place it on the ground.
    objective:
      "0": Make a forge
      "1": Set it down
    title: Build a forge
  fried-egg:
    help: At the campfire, fry an egg from your own hens.
    objective:
      "0": Fry an egg
    title: Breakfast
  gather:
    help: Pick up loose stones and pull fiber from shrubs and ferns with F, and dig soft ground with bare hands for soil.
    objective:
      "0": Pull fiber
      "1": Pick up stones
      "2": Dig soil
    title: Gather by hand
  go-fishing:
    help: "Dig dirt for bait worms first: a cast needs one. Hold the rod (G), hold the left button and let go to cast. When the float goes under, click and reel."
    objective:
      "0": Catch fish
    title: Go fishing
  harvest:
    help: "A crop is ripe when it is full grown: F on it harvests produce and seed."
    objective:
      "0": Harvest wheat
    title: Harvest
  hold-breath:
    help: Dive and come up before your breath runs out.
    objective:
      "0": Stay under 15 s
    title: Hold your breath
  hunt:
    help: "Hunt with the spear. Thrown, it hits harder."
    objective:
      "0": "Kill a hen, hare or goat"
    title: Hunt
  hunting-axe:
    help: A kill dressed with it gives its hide and more meat.
    objective:
      "0": Make it
      "1": Dress a kill with it
    title: A hunting axe
  iron:
    help: "Smelting mixed ore gives iron as well as copper and tin."
    objective:
      "0": Smelt iron ingots
      "1": Make an iron pickaxe
    title: The iron age
  long-shot:
    help: Draw fully and aim above it.
    objective:
      "0": Kill from 20 m
    title: A long shot
  long-swim:
    help: Swim steady. Sprinting tires you fast.
    objective:
      "0": Swim
    title: A long swim
  map:
    help: "Open the map (M), right-click a place at least 200 m away to mark it, and walk there."
    objective:
      "0": "Open the map (M)"
      "1": Reach a waypoint
    title: Read the map
  ore:
    help: "Copper and tin show in the rock as mixed ore; coal sits in dark seams."
    objective:
      "0": Dig ore
      "1": Dig coal
    title: Find ore
  pack:
    help: "Press I or Tab to open your pack and craft with what you gathered."
    objective:
      "0": "Open the pack (I)"
    title: Open your pack
  pen:
    help: Set fences on the cell edges round a yard, close it with a gate, and lead your animal in.
    objective:
      "0": Build a pen with a gate
      "1": Pen a tamed animal
    title: Build a pen
  planks-rope:
    help: "In the pack (I), the Craft row makes planks from a log and rope from three fiber."
    objective:
      "0": Saw planks
      "1": Twist rope
    title: Planks and rope
  plant:
    help: Plant wheat seed on tilled soil with the right button.
    objective:
      "0": Plant wheat seeds
    title: Plant a field
  put-out:
    help: Fires start in the dry season.
    objective:
      "0": Put out a fire
    title: Put out a fire
  reef:
    help: Dive to a warm reef and mine some reef rock with a pickaxe.
    objective:
      "0": Mine reef rock
    title: Get a reef
  relight:
    help: Touch it to a fire.
    objective:
      "0": Relight a torch
    title: Relight a torch
  rod:
    help: Make a rod at the workbench from planks, rope and fiber.
    objective:
      "0": Make a fishing rod
    title: Make a fishing rod
  sea-fishing:
    help: Cast from the shore into the sea, then from a river bank or a lake.
    objective:
      "0": Fish the sea
      "1": Fish a river or lake
    title: Off the shore
  smelt:
    help: "Put ore and coal in the forge (F) and smelt bronze."
    objective:
      "0": Smelt bronze ingots
    title: Smelt bronze
  soft-landing:
    help: Deep water breaks a fall.
    objective:
      "0": Fall into deep water
    title: Into the water
  spear:
    help: "In the pack, the Craft row makes a spear from a log, stone and fibre."
    objective:
      "0": Make a stone spear
    title: Make a spear
  still:
    help: Fill the still at the sea. The fire boils the salt out.
    objective:
      "0": Set a still by a fire
      "1": Drink from it
    title: Water from the sea
  stone-tools:
    help: "At the workbench (F), make a stone pickaxe and a stone shovel."
    objective:
      "0": Make a stone pickaxe
      "1": Make a stone shovel
    title: Stone tools
  storage:
    help: "At the workbench (F), make a chest from eight planks. Set it down, open it with F and put a stack in it."
    objective:
      "0": Make a chest
      "1": Set it down
      "2": Store a stack
    title: A chest
  straw:
    help: Two fibre make a straw.
    objective:
      "0": Make a straw
    title: A cactus straw
  swim:
    help: Walk into deep water and swim.
    objective:
      "0": Swim
    title: Into the water
  sword:
    help: Make it at the workbench from bronze.
    objective:
      "0": Make a bronze sword
    title: A sword
  tame:
    help: Stand still with its food in hand and let a wild animal come to you, then feed it.
    objective:
      "0": Tame a hen
    title: Tame an animal
  tan:
    help: Hang a hide on the tanning rack.
    objective:
      "0": Make leather
    title: Tan a hide
  three-crops:
    help: "Wild plants give turnip, chili and frost kale seed. Chili grows where it is hot, frost kale where it is cool."
    objective:
      "0": Harvest turnips
      "1": Harvest chilies
      "2": Harvest frost kale
    title: A mixed field
