species:
  deepback:
    caps: "DEEPBACK"
    entry: A heavy cold-water fish of the shelf and the deep. Small schools cruise below two and a half meters, and a hooked deepback runs long and tires slowly.
    lower: deepback
    name: Deepback
    tip: Fish where the shelf drops close to the shore, where the water turns dark.
  eel:
    caps: "EEL"
    entry: Long, dark and patient. Eels keep to the bed of rivers and shallows in ones and twos and fight in hard, twisting runs.
    lower: eel
    name: Eel
    tip: Ease off whenever it runs. More lines are lost to eels than to anything else.
  giant_clam:
    caps: "GIANT CLAM"
    entry: A clam as wide as a cart wheel, set in the sand of warm reef shallows with its blue mantle open to the sun. It shuts when anything comes within four meters and opens again once it has gone.
    lower: giant clam
    name: Giant clam
    tip: Swim up slowly and it still shuts. Wait a while at a distance and it opens.
  lobster:
    caps: "SPINY LOBSTER"
    entry: A long-feelered crawler of rocky shelf and reef, from cool kelp to warm coral. It keeps to the bed in ones and twos and backs away from anything that swims too close.
    lower: spiny lobster
    name: Spiny lobster
    tip: On the bed of the shelf, under kelp or along a reef. It does not take a lure.
  meadow-hen:
    caps: "YARD HEN"
    entry: A meadow hen scratches for seed in the long grass and runs from anything taller than a fence post. Kept in a yard she lays an egg a day.
    lower: yard hen
    name: Yard hen
    tip: Stand still with wheat seed in hand and let her come to you. Three feeds and she follows.
  minnow:
    caps: "MINNOW"
    entry: The first fish most anglers land. Minnows crowd the shallows and river mouths in schools of thirty or more and turn as one when a shadow crosses them. They bite quickly and give up easily.
    lower: minnow
    name: Minnow
    tip: Cast anywhere near a warm shore. A school finds the lure in seconds.
  octopus:
    caps: "DEN OCTOPUS"
    entry: A clever crawler of reefs and rocky shelf that keeps a den with shells piled at its door. It takes the color of the rock when still and flushes red when it moves. Come within six meters and it inks and jets home, and stays hidden until you have gone.
    lower: den octopus
    name: Den octopus
    tip: Look for the shells at its door, then keep back and wait.
  perch:
    caps: "BANDED PERCH"
    entry: Striped, deep-bodied and curious. Perch hold the river channels in loose groups of a dozen, in any river that does not freeze, and one will follow a lure a long way before it commits.
    lower: banded perch
    name: Banded perch
    tip: Nibbles come in threes. Wait for the float to go under.
  plodder:
    caps: "PLODDER"
    entry: "The plodder is the great slow beast of the fields: two meters of patience that grazes from dawn to dusk. A kept cow gives a pail of milk a day."
    lower: plodder
    name: Plodder
    tip: Five feeds of turnip or turf. It needs two cells of grass each in its pen.
  pond_diver:
    caps: "POND DIVER"
    entry: A dark little duck that dives for its food and comes up somewhere else. Pond divers keep to deeper pools and slow river reaches in ones and twos. Ducks are protected.
    lower: pond diver
    name: Pond diver
    tip: "Watch the water where it went under; it surfaces a few meters off."
  ray:
    caps: "RAY"
    entry: A flat grazer that lies on the sand and lifts off in slow wingbeats. Rays travel alone or in pairs along the bed of warm shallows and shelf, well out from the beach.
    lower: ray
    name: Ray
    tip: Cast long, over sand. A ray never schools, so a bite is one fish, not one of many.
  reed_dabbler:
    caps: "REED DABBLER"
    entry: "The common duck of rivers, marsh pools and quiet shallows. Dabblers float in small flocks, tip up to feed with their tails in the air, paddle off when you come close and sleep on the water at night. Ducks are protected; their eggs and feathers are gathered, not taken."
    lower: reed dabbler
    name: Reed dabbler
    tip: Slow water near reeds. Come up quietly or they paddle off.
  reef:
    caps: "REEF FISH"
    entry: The prize of warm water. Tall-finned and nervous, reef fish shoal in small groups over tropical shallows that never fall below 23 degrees, and give the shortest bite window of anything in the sea.
    lower: reef fish
    name: Reef fish
    tip: The hook window is under half a second. Watch the float, not the fish.
  reef_turtle:
    caps: "REEF TURTLE"
    entry: "A slow, old swimmer of warm reefs and the shelf beyond them, alone and unhurried. Reef turtles are protected: none may be caught."
    lower: reef turtle
    name: Reef turtle
    tip: Watch it go by. A line cast at one is refused.
  sea_otter:
    caps: "SEA OTTER"
    entry: "Rafts of two or three float on their backs over cool kelp and rocky coasts, and paddle off when a swimmer comes near. Sea otters are protected: none may be caught."
    lower: sea otter
    name: Sea otter
    tip: Cool coasts, over kelp. Keep your distance and they stay.
  seal:
    caps: "ICE SEAL"
    entry: "Gray seals of the cold seas and the kelp. They lie out on the floes and slide in when you come within nine meters, then surface somewhere else a while later. Seals are protected: none may be caught."
    lower: ice seal
    name: Ice seal
    tip: Cold water, near the ice or the kelp. Where seals are, the fish are.
  serpent:
    caps: "SEA SERPENT"
    entry: Rare and solitary, found only past the drop-off in any deep sea that does not freeze. A serpent seldom takes a lure and pulls like a boat. Every angler has a story about one that got away.
    lower: sea serpent
    name: Sea serpent
    tip: There is at most one in any water. Deep water, a long cast and patience.
  shore_crab:
    caps: "SHORE CRAB"
    entry: A small green-brown crab of every warm or cool shore, in rock pools, river mouths and the sand of the shallows. It walks sideways along the bed and scuttles off when a shadow comes near.
    lower: shore crab
    name: Shore crab
    tip: Look in the shallows by the rocks. It does not take a lure.
  silverfin:
    caps: "SILVERFIN"
    entry: A bright, fast surface fish of cool coasts, from the edge of the ice to water as warm as 17 degrees. Silverfin skim the top two meters and scatter at a splash, then close ranks again a few seconds later.
    lower: silverfin
    name: Silverfin
    tip: Let the splash settle before you expect a bite.
  tube_worm:
    caps: "PLUME WORM"
    entry: White tubes taller than a person crowd round the deep vents, each with a red plume out in the warm water. The plume snaps back into its tube when anything comes within five meters. They live on the vent, not on the light.
    lower: plume worm
    name: Plume worm
    tip: "Only at the vents on the deepest floor. Nothing worth taking; the vent is the prize."
  woolback:
    caps: "WOOLBACK"
    entry: Woolbacks graze the open fields in loose flocks, heads down, and lift them all at once at a sound. A kept one grows a fleece worth shearing every four days.
    lower: woolback
    name: Woolback
    tip: Four feeds of wheat or turf, standing still. Pen them on grass and they feed themselves.
